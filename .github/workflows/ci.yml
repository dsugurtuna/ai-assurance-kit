name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Quickstart smoke test
        run: |
          aiak init "$RUNNER_TEMP/my-use-case.yaml"
          aiak check "$RUNNER_TEMP/my-use-case.yaml"
          aiak check examples/ --today 2026-09-30
          aiak render examples/service-chatbot.yaml -o "$RUNNER_TEMP/chatbot-card.html"
          aiak diff examples/history/grant-triage.v1.yaml examples/grant-triage.yaml
          aiak register examples/ -o "$RUNNER_TEMP/register.csv"
      - name: Committed JSON Schema is current
        run: |
          aiak schema -o "$RUNNER_TEMP/schema.json"
          diff "$RUNNER_TEMP/schema.json" schema/ai-use-record.schema.json
