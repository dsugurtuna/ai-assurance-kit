[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-assurance-kit"
version = "0.1.0"
description = "Describe one AI use case as a structured record, validate it, run explainable checks and render a one-page card. Unofficial."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ugur Tuna" }]
keywords = ["ai-governance", "ai-assurance", "algorithmic-transparency", "risk", "nist-ai-rmf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "jsonschema>=4.21",
]

[project.scripts]
aiak = "ai_assurance_kit.cli:main"

[project.urls]
Homepage = "https://github.com/dsugurtuna/ai-assurance-kit"
Issues = "https://github.com/dsugurtuna/ai-assurance-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_assurance_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
